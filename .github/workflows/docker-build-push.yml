name: CI - Build and Push Docker image to ACR

on:
  push:
    branches:
      - Dev
    tags:
      - 'v*.*'  # Tous les tags commençant par v, ex: v1.1, v1.2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Important pour récupérer les tags

      - name: Set Docker image tag
        id: set_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          else
            TAG_NAME=${GITHUB_SHA::8}  # SHA court si pas de tag
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "IMAGE_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}/hello-node:$TAG_NAME" >> $GITHUB_ENV

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .
          echo "Docker image built: $IMAGE_NAME"

      - name: Login to ACR
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME
          echo "Docker image pushed: $IMAGE_NAME"

      - name: Trigger CD pipeline
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "deploy",
              client_payload: { image: process.env.IMAGE_NAME }
            })
